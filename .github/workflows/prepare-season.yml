name: Prepare historical season

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Season start year, e.g. 2024 for 2024/25"
        required: true
        default: "2024"

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python scripts/prepare_season.py --year ${{ inputs.year }}
      - uses: actions/upload-artifact@v4
        with:
          name: futx-prepared-${{ inputs.year }}
          path: outputs/prepared/*.csv
